[package]
name = "sculpt-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
glam = { version = "0.33.12", features = ["serde", "bytemuck"] }
meshopt = "0.6.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.16.2"
thiserror = "2.0.21"
